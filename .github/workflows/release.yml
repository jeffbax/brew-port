name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    timeout-minutes: 45
    name: Release checks (${{ matrix.runner }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: melusina-org/setup-macports@v1.1.6
        id: macports
        with:
          cache: disable
          parameters: .github/parameters/setup-macports.yaml
      - name: Install ShellCheck from a bottle
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install --force-bottle shellcheck
      - name: Expose MacPorts binaries
        run: echo "${{ steps.macports.outputs.prefix }}/bin" >> "$GITHUB_PATH"
      - name: Verify native architecture
        run: test "$(uname -m)" = "$EXPECTED_ARCH"
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
      - name: System Bash 3.2
        run: |
          /bin/bash tests/test.sh
          /bin/bash tests/release.sh
      - name: Current Bash
        run: |
          "${{ steps.macports.outputs.prefix }}/bin/bash" tests/test.sh
          "${{ steps.macports.outputs.prefix }}/bin/bash" tests/release.sh
      - name: Real Brewfile installation
        run: /bin/bash tests/integration.sh
        env:
          BREW_PORT_PORT_BIN: ${{ steps.macports.outputs.prefix }}/bin/port
          GITHUB_TOKEN: ${{ github.token }}

  release:
    needs: checks
    if: needs.checks.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npx --yes \
            --package semantic-release@25.0.9 \
            --package @semantic-release/commit-analyzer@13.0.1 \
            --package @semantic-release/release-notes-generator@14.1.1 \
            --package conventional-changelog-conventionalcommits@10.4.0 \
            --package @semantic-release/exec@7.1.0 \
            --package @semantic-release/github@12.0.10 \
            semantic-release
