name: Checks
on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    timeout-minutes: 45
    name: Checks (${{ matrix.runner }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: melusina-org/setup-macports@v1.1.6
        id: macports
        with:
          cache: disable
          parameters: .github/parameters/setup-macports.yaml
      - name: Install ShellCheck from a bottle
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install --force-bottle shellcheck
      - name: Expose MacPorts binaries
        run: echo "${{ steps.macports.outputs.prefix }}/bin" >> "$GITHUB_PATH"
      - name: Verify native architecture
        run: test "$(uname -m)" = "$EXPECTED_ARCH"
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
      - name: System Bash 3.2
        run: |
          /bin/bash tests/test.sh
          /bin/bash tests/release.sh
      - name: Current Bash
        run: |
          "${{ steps.macports.outputs.prefix }}/bin/bash" tests/test.sh
          "${{ steps.macports.outputs.prefix }}/bin/bash" tests/release.sh
      - name: Real Brewfile installation
        run: /bin/bash tests/integration.sh
        env:
          BREW_PORT_PORT_BIN: ${{ steps.macports.outputs.prefix }}/bin/port
          GITHUB_TOKEN: ${{ github.token }}
