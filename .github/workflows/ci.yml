name: Checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    name: Checks (${{ matrix.runner }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify native architecture
        run: test "$(uname -m)" = "$EXPECTED_ARCH"
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
      - run: brew install shfmt shellcheck jq bash
      - name: System Bash 3.2
        run: /bin/bash tests/test.sh && /bin/bash tests/release.sh
      - name: Current Bash
        run: |
          "$(brew --prefix)/bin/bash" tests/test.sh
          "$(brew --prefix)/bin/bash" tests/release.sh
